name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libx11-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev libpng-dev libjpeg-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release -DFLTK_BACKEND_WAYLAND=OFF
      - name: Build library, demo and tests
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Install CMake package
        run: cmake --install build/ci --config Release --prefix build/install
      - name: Configure installed-package consumer
        run: cmake -S tests/consumer -B build/consumer -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install"
      - name: Build installed-package consumer
        run: cmake --build build/consumer --config Release --parallel 2
      - name: Test installed-package consumer
        run: ctest --test-dir build/consumer -C Release --output-on-failure
